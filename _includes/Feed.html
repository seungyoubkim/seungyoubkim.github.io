<!-- feed with filter-->
<div class="related-wrapper">
{% assign post_items = site.posts | sort: "date" | reverse %}
{% for post in post_items %}
    {%- if post.feed == "show" -%}
            <div class="notelist-feed">
                <a href="{{ site.baseurl }}{{post.url}}">
                    <p>{{ post.title }}</p>
                </a>
            </div>
    {%- endif -%}
{%- endfor -%}
</div>
